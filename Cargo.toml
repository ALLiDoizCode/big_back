[package]
name = "big_back"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Pinned to Bevy 0.19 to match the planned stack (lightyear 0.30, avian3d 0.7,
# bevy_hanabi 0.19, bevy_firework 0.10). bevy_asset_loader 0.27 is the release
# line for Bevy 0.19 (0.28 requires Bevy 0.20).
bevy = "0.19.1"
bevy_asset_loader = "0.27.0"

[dev-dependencies]
# The asset viewer example uses Bevy's built-in fly camera.
bevy = { version = "0.19.1", features = ["free_camera"] }

# Fast dev builds: optimise dependencies, keep our own code quick to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
